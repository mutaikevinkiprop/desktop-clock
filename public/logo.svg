<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Desktop Clock">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a202e" />
      <stop offset="1" stop-color="#0e1118" />
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5f8cff" />
      <stop offset="1" stop-color="#8f6bff" />
    </linearGradient>
  </defs>

  <!-- Rounded panel -->
  <rect x="14" y="14" width="484" height="484" rx="120" fill="url(#panel)" />

  <!-- Accent ring -->
  <circle cx="256" cy="256" r="152" fill="none" stroke="url(#ring)" stroke-width="18" />

  <!-- Clock hands -->
  <g stroke="#f5f7fa" stroke-linecap="round">
    <line x1="256" y1="256" x2="256" y2="148" stroke-width="16" />
    <line x1="256" y1="256" x2="360" y2="256" stroke-width="14" />
  </g>

  <!-- Centre dot -->
  <circle cx="256" cy="256" r="16" fill="#f5f7fa" />
</svg>